# Render Blueprint — one-click deployment of the ANISAS Python service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: anisas-enterprise
    runtime: python
    plan: free
    region: oregon
    rootDir: ai-service
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "false"
      # Threat-intelligence keys — set these in the Render dashboard.
      # `sync: false` keeps the value out of this repository.
      - key: SHODAN_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: CENSYS_API_ID
        sync: false
      - key: CENSYS_API_SECRET
        sync: false
      - key: OTX_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: IPINFO_TOKEN
        sync: false
      - key: GREYNOISE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
